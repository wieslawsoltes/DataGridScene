# Temporary read-only investigation of the retained first PR18 browser artifact.
# Remove this workflow after diagnosis; it does not rerun tests or alter results.
name: Review retained browser evidence
on:
  pull_request:
    paths: ['.github/workflows/browser-evidence-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact failed-run evidence without executing artifact content
        uses: actions/download-artifact@v4
        with:
          name: browser-validation-features
          path: evidence
          run-id: 38541650715
          github-token: ${{ github.token }}
      - name: Summarize existing reports and selected diagnostic fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('evidence')
          for file in sorted(root.rglob('*.json')):
              if file.stat().st_size > 64 * 1024 * 1024:
                  print('OVERSIZED', str(file)); continue
              if 'column-chooser' not in file.parts:
                  continue
              value = json.loads(file.read_text(encoding='utf-8'))
              print('\nFILE', str(file))
              if isinstance(value, dict) and isinstance(value.get('results'), list):
                  print('REPORT', value.get('passed'), value.get('passedCount'), len(value['results']))
                  for result in value['results']:
                      error = str(result.get('error') or '')
                      # Keep small stack context without printing a giant embedded snapshot.
                      if 'Chooser state timed out:' in error:
                          error = error.split('Chooser state timed out:', 1)[0] + 'Chooser state timed out (see retained snapshot)'
                      print(json.dumps({'name': result.get('name'), 'passed': result.get('passed'), 'error': error[:2400]}, ensure_ascii=False))
              elif isinstance(value, dict) and isinstance(value.get('chooser'), dict):
                  c, g = value['chooser'], value.get('grid', {})
                  actions = c.get('actions') or {}
                  print(json.dumps({'chooser': {key: c.get(key) for key in ['open','selectedField','searchText','scope','widthText','hasPendingWidth','validationMessage','totalCount','resultCount','metadataRefreshCount','searchPassCount','listPublicationCount','createdRowCount','rowBindCount','realizedRowCount','focusedAction','focusedText','selectionStart','selectionLength']},
                    'actions': {key: rect for key, rect in actions.items() if not key.startswith(('row-','check-'))},
                    'rowSample': (c.get('rows') or [])[:3], 'matchingSample': (c.get('matchingFields') or [])[:8],
                    'grid': {key:g.get(key) for key in ['ready','scenario','recordCount','lastError','message','isEditing']},
                    'columnSample': (g.get('columns') or [])[:3]}, ensure_ascii=False))
          PY
