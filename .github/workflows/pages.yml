name: Publish Pages
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download the exact validated browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-application
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy tested Uno WebAssembly application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out the validated sources for deployment verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification browser
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium
      - name: Verify the actual public Pages application
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-deployment.mjs
      - name: Verify native custom row editors on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/row-editor-templates.mjs
      - name: Verify responsive row form layout on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/row-form-layout.mjs
      - name: Verify transactional row forms on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/row-editing.mjs
      - name: Verify native cell Tab order on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/native-tab-order.mjs
      - name: Verify adaptive native editors on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/template-selectors.mjs
      - name: Verify all native sample modes and scrolling on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/native-modes.mjs
      - name: Verify native editor popups and recycling on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/native-cells.mjs
      - name: Verify native gestures and painted scrollbars on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/native-input-regressions.mjs && node tests/browser/scrollbars.mjs
      - name: Verify recent filters and expanded expressions on public Pages
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          BROWSER_RESULTS: artifacts/deployed-verification
        run: node tests/browser/filter-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-site-verification
          path: artifacts/deployed-verification/
