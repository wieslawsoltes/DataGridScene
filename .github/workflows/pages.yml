name: Publish Pages
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download the exact validated browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-application
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy tested Uno WebAssembly application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out the validated sources for deployment verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification browser
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium
      - name: Verify the actual public Pages application
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-deployment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-site-verification
          path: artifacts/deployed-verification/
