name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, data, layout and export conformance
        run: dotnet run --project tests/DataGridScene.Tests -c Release
      - name: Build and package independent libraries
        run: |
          for project in Core Data Layout Export Rendering.Skia; do
            dotnet pack src/DataGridScene.$project -c Release -o artifacts/packages
          done
      - name: Source archive
        if: always()
        run: mkdir -p artifacts && git archive --format=zip HEAD -o artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation-and-packages
          path: artifacts/
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-desktop-${{ runner.os }}-uno-6.7.30-v2
      - name: Build shared Uno desktop application
        run: dotnet build samples/DataGridScene.Demo -c Release -f net10.0-desktop -p:DataGridSceneTarget=net10.0-desktop
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-browser-${{ runner.os }}-uno-6.7.30-v2
      - name: Install WASM toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish actual Uno WebAssembly application
        run: dotnet publish samples/DataGridScene.Demo -c Release -f net10.0-browserwasm -p:DataGridSceneTarget=net10.0-browserwasm -p:WasmShellWebAppBasePath=/DataGridScene/ -o artifacts/browser
      - name: Prepare static Pages-compatible site
        run: node scripts/prepare-site.mjs
      - name: Install browser test harness
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium
      - name: Test actual WASM runtime and browser interactions
        run: npm run test:browser
      - name: Package reusable Uno control library
        run: dotnet pack src/DataGridScene.Controls -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts/browser-validation/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-application
          path: artifacts/site/
      - uses: actions/upload-artifact@v4
        with:
          name: uno-control-package
          path: artifacts/packages/
