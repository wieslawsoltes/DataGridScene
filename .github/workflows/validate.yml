name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, data, layout and export conformance
        run: dotnet run --project tests/DataGridScene.Tests -c Release
      - name: Build independent renderer
        run: dotnet build src/DataGridScene.Rendering.Skia -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: artifacts/
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-desktop-${{ runner.os }}-uno-6.7.30
      - name: Build shared Uno desktop application
        run: dotnet build samples/DataGridScene.Demo -c Release -f net10.0-desktop -p:TargetFrameworks=net10.0-desktop
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-browser-${{ runner.os }}-uno-6.7.30
      - name: Install WASM toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish actual Uno WebAssembly application
        run: dotnet publish samples/DataGridScene.Demo -c Release -f net10.0-browserwasm -p:TargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/DataGridScene/ -o artifacts/browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-application
          path: artifacts/browser/
