name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, data, layout and export conformance
        run: dotnet run --project tests/DataGridScene.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: artifacts/
